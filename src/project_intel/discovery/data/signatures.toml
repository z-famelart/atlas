# Discovery signatures — declarative technology detection table.
# Each entry maps file-presence patterns to a detected technology.
# Fields:
#   category        — "build_system" | "package_manager" | "framework" | "container" | "k8s" | "ci" | "iac"
#   name            — canonical technology slug
#   files           — list of glob patterns (matched against repo-relative paths)
#   manifest_file   — file to open for key-presence check (optional)
#   manifest_key    — dot-separated key path inside the manifest (optional, requires manifest_file)

# ── Build systems ─────────────────────────────────────────────────────────────

[[signatures]]
category = "build_system"
name = "maven"
files = ["pom.xml"]

[[signatures]]
category = "build_system"
name = "gradle"
files = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]

[[signatures]]
category = "build_system"
name = "make"
files = ["Makefile", "GNUmakefile"]

[[signatures]]
category = "build_system"
name = "cmake"
files = ["CMakeLists.txt"]

[[signatures]]
category = "build_system"
name = "bazel"
files = ["BUILD", "BUILD.bazel", "WORKSPACE", "WORKSPACE.bazel"]

